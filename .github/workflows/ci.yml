name: "CI: Build and Test"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet-format:
    name: .Net Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Kentico.Xperience.Labs.SimpleStats.slnx --locked-mode

      - name: Run dotnet format
        run: dotnet format Kentico.Xperience.Labs.SimpleStats.slnx --exclude ./examples/ --no-restore --verify-no-changes

  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: dotnet-format
    defaults:
      run:
        shell: pwsh

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      # Throwaway SQL Server of this job (service container below); not a secret.
      SQL_SA_PASSWORD: Ci-Integration-Tests-1
      # Integration tests (tests/Kentico.Xperience.Labs.SimpleStats.Admin.IntegrationTests) run against this empty Xperience database.
      SIMPLESTATS_INTEGRATION_SQL: Data Source=localhost,1433;Initial Catalog=simple-stats-integration-tests;User ID=sa;Password=Ci-Integration-Tests-1;Encrypt=False

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci-Integration-Tests-1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Integration-Tests-1 -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Kentico.Xperience.Labs.SimpleStats.Admin/Client/package-lock.json

      - name: Install dependencies
        run: |
          dotnet restore `
            --locked-mode

      - name: Build Solution
        run: |
          dotnet build `
            --configuration Release `
            --no-restore

      - name: Type-check Admin client
        working-directory: src/Kentico.Xperience.Labs.SimpleStats.Admin/Client
        run: npm run typecheck

      - name: Create integration test database
        run: |
          dotnet tool restore
          # From the repository root (no Data/Template.zip), so the database has the Xperience schema and no sample data.
          dotnet kentico-xperience-dbmanager -- `
            --server-name "localhost,1433" `
            --username sa `
            --password $env:SQL_SA_PASSWORD `
            --admin-password $env:SQL_SA_PASSWORD `
            --database-name simple-stats-integration-tests `
            --recreate-existing-database

      - name: Test Solution
        run: |
          dotnet test `
            --configuration Release `
            --no-build `
            --no-restore
